<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Ecom H F</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-50">
  <!-- Status bar -->
  <div class="status-bar bg-white flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- App Header -->
  <div class="bg-white px-4 py-3 border-b border-gray-100 flex items-center gap-3">
    <div class="flex-1 flex items-center bg-gray-100 rounded-xl px-3 py-2">
      <svg class="w-4 h-4 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <span class="text-sm text-gray-400">搜索商品</span>
    </div>
    <div class="relative">
      <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">3</span>
    </div>
    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500"></div>
  </div>

  <!-- Category nav header -->
  <div class="bg-white flex border-b border-gray-100 overflow-x-auto px-2">
    <button class="flex-shrink-0 px-4 py-2.5 text-sm font-semibold text-red-500 border-b-2 border-red-500">推荐</button>
    <button class="flex-shrink-0 px-4 py-2.5 text-sm text-gray-600">服饰</button>
    <button class="flex-shrink-0 px-4 py-2.5 text-sm text-gray-600">数码</button>
    <button class="flex-shrink-0 px-4 py-2.5 text-sm text-gray-600">美妆</button>
    <button class="flex-shrink-0 px-4 py-2.5 text-sm text-gray-600">家居</button>
    <button class="flex-shrink-0 px-4 py-2.5 text-sm text-gray-600">食品</button>
    <button class="flex-shrink-0 px-4 py-2.5 text-sm text-gray-600">母婴</button>
  </div>

  <!-- Banner header area -->
  <div class="bg-white p-4">
    <div class="h-32 rounded-2xl bg-gradient-to-r from-red-400 via-orange-400 to-yellow-400 flex items-center px-6">
      <div class="text-white">
        <div class="text-xs opacity-80">618 大促</div>
        <div class="text-2xl font-bold mt-1">全场5折起</div>
        <div class="text-sm opacity-80 mt-1">满300减50 · 限时抢购</div>
      </div>
      <div class="ml-auto text-5xl">🎁</div>
    </div>
  </div>

  <!-- Quick entries -->
  <div class="bg-white px-4 py-3 border-t border-gray-100">
    <div class="grid grid-cols-5 gap-2">
      <div class="flex flex-col items-center">
        <div class="w-10 h-10 rounded-xl bg-red-100 flex items-center justify-center text-lg">⚡</div>
        <span class="text-xs text-gray-600 mt-1">秒杀</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-10 h-10 rounded-xl bg-orange-100 flex items-center justify-center text-lg">🎫</div>
        <span class="text-xs text-gray-600 mt-1">优惠券</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-10 h-10 rounded-xl bg-green-100 flex items-center justify-center text-lg">💰</div>
        <span class="text-xs text-gray-600 mt-1">签到</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-10 h-10 rounded-xl bg-blue-100 flex items-center justify-center text-lg">📦</div>
        <span class="text-xs text-gray-600 mt-1">免邮</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center text-lg">🏆</div>
        <span class="text-xs text-gray-600 mt-1">排行</span>
      </div>
    </div>
  </div>

  <!-- Section header: 限时秒杀 -->
  <div class="bg-white mt-2 px-4 py-3 flex items-center justify-between border-b border-gray-50">
    <div class="flex items-center gap-2">
      <span class="font-bold text-gray-900">限时秒杀</span>
      <span class="px-1.5 py-0.5 text-xs bg-red-500 text-white rounded font-medium">HOT</span>
    </div>
    <div class="flex items-center gap-1 text-sm text-gray-400">
      <span>02</span>:<span>35</span>:<span>18</span>
      <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </div>
  </div>

  <!-- Product grid -->
  <div class="bg-white p-3 grid grid-cols-2 gap-3">
    <div class="bg-gray-50 rounded-xl overflow-hidden">
      <div class="aspect-square bg-gradient-to-br from-gray-200 to-gray-300 flex items-center justify-center text-3xl">👟</div>
      <div class="p-2.5">
        <p class="text-xs text-gray-800 line-clamp-2 leading-snug">运动鞋跑步鞋轻便透气</p>
        <div class="flex items-center justify-between mt-1.5">
          <span class="text-red-500 font-bold text-sm">¥89</span>
          <span class="text-xs text-gray-400 line-through">¥199</span>
        </div>
      </div>
    </div>
    <div class="bg-gray-50 rounded-xl overflow-hidden">
      <div class="aspect-square bg-gradient-to-br from-blue-200 to-indigo-300 flex items-center justify-center text-3xl">🎧</div>
      <div class="p-2.5">
        <p class="text-xs text-gray-800 line-clamp-2 leading-snug">无线蓝牙耳机降噪</p>
        <div class="flex items-center justify-between mt-1.5">
          <span class="text-red-500 font-bold text-sm">¥129</span>
          <span class="text-xs text-gray-400 line-through">¥399</span>
        </div>
      </div>
    </div>
    <div class="bg-gray-50 rounded-xl overflow-hidden">
      <div class="aspect-square bg-gradient-to-br from-pink-200 to-rose-300 flex items-center justify-center text-3xl">💄</div>
      <div class="p-2.5">
        <p class="text-xs text-gray-800 line-clamp-2 leading-snug">口红礼盒套装持久</p>
        <div class="flex items-center justify-between mt-1.5">
          <span class="text-red-500 font-bold text-sm">¥69</span>
          <span class="text-xs text-gray-400 line-through">¥198</span>
        </div>
      </div>
    </div>
    <div class="bg-gray-50 rounded-xl overflow-hidden">
      <div class="aspect-square bg-gradient-to-br from-green-200 to-teal-300 flex items-center justify-center text-3xl">🍵</div>
      <div class="p-2.5">
        <p class="text-xs text-gray-800 line-clamp-2 leading-snug">明前龙井茶叶礼盒</p>
        <div class="flex items-center justify-between mt-1.5">
          <span class="text-red-500 font-bold text-sm">¥158</span>
          <span class="text-xs text-gray-400 line-through">¥398</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Sticky footer tab bar -->
  <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-100 pb-6">
    <div class="flex items-center pt-2">
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-xs mt-1 text-red-500 font-medium">首页</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span class="text-xs mt-1 text-gray-400">分类</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="relative">
          <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span class="absolute -top-1 -right-2 w-4 h-4 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">3</span>
        </div>
        <span class="text-xs mt-1 text-gray-400">购物车</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span class="text-xs mt-1 text-gray-400">消息</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs mt-1 text-gray-400">我的</span>
      </div>
    </div>
  </div>
</body>
</html>
