<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UI 标注审核台</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/fixes.css"></head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">◫</span><strong>UI 标注审核台</strong><span class="dataset-label">本地数据集</span></div>
    <div class="image-context"><button id="previous" type="button" title="上一张">‹</button><div><strong id="title">正在加载标注...</strong><span id="progress"></span></div><button id="next" type="button" title="下一张">›</button></div>
    <div class="top-actions"><span id="save-state">已保存</span><button id="undo" type="button" disabled>撤销</button><button id="redo" type="button" disabled>重做</button><button id="save" class="primary" type="button" disabled>保存人工审核</button></div>
  </header>
  <main class="workbench">
    <aside class="left-panel">
      <div class="panel-tabs" role="tablist"><button class="panel-tab active" data-left-tab="screens" role="tab">截图</button><button class="panel-tab" data-left-tab="objects" role="tab">图层</button></div>
      <section id="screen-panel" class="left-content"><div class="filter-row"><input id="screen-search" placeholder="搜索截图或状态"></div><div class="status-filters"><button data-status-filter="all" class="active">全部</button><button data-status-filter="draft">待审核</button><button data-status-filter="issues">有问题</button></div><div id="screenshot-list" class="screenshot-list"></div></section>
      <section id="object-panel" class="left-content" hidden><div class="filter-row"><select id="type-filter"><option value="">全部类型</option></select></div><label class="toggle"><input id="show-human" type="checkbox" checked> 人工标注</label><label class="toggle"><input id="show-ai" type="checkbox" checked> AI 初审建议</label><label class="toggle"><input id="show-issues" type="checkbox" checked> 审阅问题</label><p class="tree-hint">结构树：点击节点选中；展开节点查看子元素。</p><div id="element-list" class="element-list element-tree" role="tree"></div></section>
      <footer class="left-footer"><button id="history-toggle" type="button">⌁ 历史与运行详情</button></footer>
    </aside>
    <section class="canvas-stage" aria-label="截图标注画布">
      <div class="canvas-toolbar"><span id="selection-status">点击元素、AI 建议或问题开始审核</span><div class="canvas-actions"><select id="device-preview" title="设备预览"><option value="original">原始截图</option><option value="375x667">iPhone SE · 375 × 667</option><option value="390x844">iPhone 14 · 390 × 844</option><option value="430x932">iPhone 14 Pro Max · 430 × 932</option><option value="360x800">Android · 360 × 800</option><option value="768x1024">iPad · 768 × 1024</option><option value="1440x900">桌面 · 1440 × 900</option></select><button id="zoom-out" type="button" title="缩小">−</button><button id="fit-canvas" type="button">适配画布</button><button id="zoom-in" type="button" title="放大">＋</button><span id="zoom-level">100%</span><span class="legend"><i class="human-dot"></i>人工 <i class="ai-dot"></i>AI <i class="issue-dot"></i>问题</span></div></div>
      <p id="status" role="status">正在加载数据集...</p>
      <div id="canvas-wrap" class="canvas-wrap" hidden><div class="ruler ruler-x" id="ruler-x"></div><div class="ruler ruler-y" id="ruler-y"></div><div id="canvas-content" class="canvas-content"><img id="screenshot" alt="当前 UI 截图"><svg id="overlay" aria-label="标注覆盖层"></svg></div></div>
    </section>
    <aside class="right-panel">
      <div class="panel-tabs inspector-tabs" role="tablist"><button class="panel-tab active" data-inspector-tab="object" role="tab">对象</button><button class="panel-tab" data-inspector-tab="ai" role="tab">AI 初审 <span id="ai-count" class="count-badge">0</span></button><button class="panel-tab" data-inspector-tab="issues" role="tab">问题 <span id="issue-count" class="count-badge">0</span></button></div>
      <section id="object-inspector" class="inspector-content"><div id="object-empty" class="empty-state"><strong>选择一个元素</strong><p>在画布或图层列表中选择元素后，可编辑它的类型、文字和边界框。</p></div><div id="selected-editor" hidden><div class="inspector-heading"><div><span class="eyebrow">当前元素</span><h2 id="selection-summary"></h2></div><span id="selection-badge" class="state-badge">已选择</span></div><label>组件类型 <select id="element-type"></select></label><label>显示文字 <input id="element-text"></label><label><span class="field-label">渲染方式 <span class="help-tooltip" tabindex="0" aria-label="渲染方式说明">?<span class="help-tooltip-content"><strong>重建时如何实现该元素</strong><br><b>native</b>：用原生 UI 组件重建，如按钮、输入框、列表。<br><b>hybrid</b>：原生结构搭配图片、图标或自定义视觉。<br><b>asset</b>：保留为图片/素材，不拆成可交互组件。<br><b>semantic-only</b>：只保留语义和布局信息，不生成可见控件。</span></span></span><select id="element-render"><option>native</option><option>hybrid</option><option>asset</option><option>semantic-only</option></select></label><details class="element-details"><summary>详细信息</summary><div id="element-metrics" class="element-metrics"></div></details><div class="bbox-fields"><label>X<input id="bbox-x" type="number" min="0"></label><label>Y<input id="bbox-y" type="number" min="0"></label><label>宽<input id="bbox-w" type="number" min="1"></label><label>高<input id="bbox-h" type="number" min="1"></label></div><div class="nudge-controls"><button data-nudge="up">上移</button><button data-nudge="down">下移</button><button data-nudge="left">左移</button><button data-nudge="right">右移</button><button data-nudge="widen">加宽</button><button data-nudge="narrow">变窄</button><button data-nudge="heighten">加高</button><button data-nudge="shorten">变矮</button></div><div class="button-stack"><button id="copy-element" type="button">复制元素</button><button id="paste-element" type="button" disabled>粘贴元素</button></div><div class="button-stack"><button id="reset-element" type="button">恢复此元素</button><button id="delete" class="danger" type="button">删除元素</button></div></div></section>
      <section id="ai-inspector" class="inspector-content" hidden><div id="ai-summary" class="ai-summary"></div><div id="ai-proposal-editor" class="ai-proposal-editor" hidden><div class="inspector-heading"><div><span class="eyebrow">AI 建议二次修正</span><h2 id="ai-proposal-title"></h2></div><span class="state-badge">AI 候选</span></div><label>组件类型 <select id="ai-proposal-type"></select></label><label>显示文字 <input id="ai-proposal-text"></label><div class="bbox-fields"><label>X<input id="ai-proposal-x" type="number" min="0"></label><label>Y<input id="ai-proposal-y" type="number" min="0"></label><label>宽<input id="ai-proposal-w" type="number" min="1"></label><label>高<input id="ai-proposal-h" type="number" min="1"></label></div><div class="button-stack"><button id="ai-proposal-apply" class="primary" type="button">采纳修正结果</button><button id="ai-proposal-cancel" type="button">取消编辑</button></div></div><div id="ai-proposal-list" class="proposal-list"></div></section>
      <section id="issues-inspector" class="inspector-content" hidden><div class="issue-actions"><select id="review-filter"><option value="">全部问题</option><option value="high">高严重度</option><option value="medium">中严重度</option><option value="low">低严重度</option></select><button id="next-issue" type="button">下一个未解决</button></div><div id="difference-list" class="difference-list"></div></section>
      <footer class="inspector-footer"><button id="reset-page" type="button">放弃本页编辑</button><button id="restore-draft" class="danger" type="button">恢复 AI 草案</button></footer>
    </aside>
  </main>
  <section id="history-drawer" class="history-drawer" hidden><div><strong>编辑历史</strong><span id="history-status">编辑 0 / 0</span></div><p>AI 初审建议、人工编辑和审阅差异在此工作台中分层显示。保存后仅人工标注会进入基准数据。</p></section>
  <script type="module" src="/app.js"></script>
</body>
</html>
