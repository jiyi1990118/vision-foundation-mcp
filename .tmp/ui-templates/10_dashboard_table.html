<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Dashboard Table</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-50 pb-20">
  <!-- Status bar -->
  <div class="status-bar bg-white flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Header -->
  <div class="bg-white px-5 py-4 border-b border-gray-100">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-sm text-gray-400">7月29日 星期三</div>
        <h1 class="text-xl font-bold mt-0.5">数据看板</h1>
      </div>
      <div class="flex items-center gap-2">
        <button class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center">
          <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
        </button>
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500"></div>
      </div>
    </div>
  </div>

  <!-- Metric cards -->
  <div class="px-4 pt-4 space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs text-gray-400">今日访问</span>
          <span class="text-xs text-green-500 font-medium">↑ 18%</span>
        </div>
        <div class="text-2xl font-bold text-gray-900 mt-1">12,845</div>
        <div class="mt-3 h-8 bg-gray-50 rounded-lg flex items-end px-1 gap-0.5">
          <div class="flex-1 bg-blue-200 rounded-t" style="height: 35%"></div>
          <div class="flex-1 bg-blue-200 rounded-t" style="height: 45%"></div>
          <div class="flex-1 bg-blue-200 rounded-t" style="height: 40%"></div>
          <div class="flex-1 bg-blue-200 rounded-t" style="height: 55%"></div>
          <div class="flex-1 bg-blue-200 rounded-t" style="height: 50%"></div>
          <div class="flex-1 bg-blue-300 rounded-t" style="height: 70%"></div>
          <div class="flex-1 bg-blue-500 rounded-t" style="height: 85%"></div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs text-gray-400">新增用户</span>
          <span class="text-xs text-green-500 font-medium">↑ 12%</span>
        </div>
        <div class="text-2xl font-bold text-gray-900 mt-1">856</div>
        <div class="mt-3 h-8 bg-gray-50 rounded-lg flex items-end px-1 gap-0.5">
          <div class="flex-1 bg-green-200 rounded-t" style="height: 40%"></div>
          <div class="flex-1 bg-green-200 rounded-t" style="height: 30%"></div>
          <div class="flex-1 bg-green-200 rounded-t" style="height: 50%"></div>
          <div class="flex-1 bg-green-200 rounded-t" style="height: 45%"></div>
          <div class="flex-1 bg-green-200 rounded-t" style="height: 60%"></div>
          <div class="flex-1 bg-green-300 rounded-t" style="height: 75%"></div>
          <div class="flex-1 bg-green-500 rounded-t" style="height: 65%"></div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs text-gray-400">成交额</span>
          <span class="text-xs text-red-500 font-medium">↓ 3%</span>
        </div>
        <div class="text-2xl font-bold text-gray-900 mt-1">¥ 68.5K</div>
        <div class="mt-3 h-8 bg-gray-50 rounded-lg flex items-end px-1 gap-0.5">
          <div class="flex-1 bg-orange-200 rounded-t" style="height: 60%"></div>
          <div class="flex-1 bg-orange-200 rounded-t" style="height: 70%"></div>
          <div class="flex-1 bg-orange-200 rounded-t" style="height: 55%"></div>
          <div class="flex-1 bg-orange-200 rounded-t" style="height: 65%"></div>
          <div class="flex-1 bg-orange-300 rounded-t" style="height: 50%"></div>
          <div class="flex-1 bg-orange-400 rounded-t" style="height: 45%"></div>
          <div class="flex-1 bg-orange-500 rounded-t" style="height: 40%"></div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs text-gray-400">转化率</span>
          <span class="text-xs text-green-500 font-medium">↑ 5%</span>
        </div>
        <div class="text-2xl font-bold text-gray-900 mt-1">3.8%</div>
        <div class="mt-3 h-8 bg-gray-50 rounded-lg flex items-end px-1 gap-0.5">
          <div class="flex-1 bg-purple-200 rounded-t" style="height: 50%"></div>
          <div class="flex-1 bg-purple-200 rounded-t" style="height: 45%"></div>
          <div class="flex-1 bg-purple-200 rounded-t" style="height: 55%"></div>
          <div class="flex-1 bg-purple-200 rounded-t" style="height: 60%"></div>
          <div class="flex-1 bg-purple-300 rounded-t" style="height: 65%"></div>
          <div class="flex-1 bg-purple-400 rounded-t" style="height: 70%"></div>
          <div class="flex-1 bg-purple-500 rounded-t" style="height: 75%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Channel performance table -->
  <div class="px-4 mt-4">
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div class="px-4 py-3 flex items-center justify-between border-b border-gray-100">
        <span class="font-semibold text-gray-900">渠道业绩排行</span>
        <div class="flex items-center gap-1 text-xs text-blue-500 font-medium">
          本周
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>

      <!-- Table columns header -->
      <div class="flex bg-gray-50 px-4 py-2 text-xs font-medium text-gray-500">
        <div class="w-10">排名</div>
        <div class="flex-1">渠道</div>
        <div class="w-16 text-right">访问量</div>
        <div class="w-16 text-right">转化率</div>
      </div>

      <!-- Table rows -->
      <div class="divide-y divide-gray-50">
        <div class="flex items-center px-4 py-3">
          <div class="w-10">
            <span class="w-5 h-5 bg-yellow-500 text-white text-xs font-bold rounded-full flex items-center justify-center">1</span>
          </div>
          <div class="flex-1 flex items-center gap-2">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-green-400 to-emerald-500"></div>
            <span class="text-sm font-medium text-gray-900">自然搜索</span>
          </div>
          <div class="w-16 text-sm text-right text-gray-700">4,523</div>
          <div class="w-16 text-sm text-right font-medium text-green-500">5.2%</div>
        </div>

        <div class="flex items-center px-4 py-3">
          <div class="w-10">
            <span class="w-5 h-5 bg-gray-300 text-white text-xs font-bold rounded-full flex items-center justify-center">2</span>
          </div>
          <div class="flex-1 flex items-center gap-2">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500"></div>
            <span class="text-sm font-medium text-gray-900">社交媒体</span>
          </div>
          <div class="w-16 text-sm text-right text-gray-700">3,102</div>
          <div class="w-16 text-sm text-right font-medium text-green-500">4.1%</div>
        </div>

        <div class="flex items-center px-4 py-3">
          <div class="w-10">
            <span class="w-5 h-5 bg-orange-300 text-white text-xs font-bold rounded-full flex items-center justify-center">3</span>
          </div>
          <div class="flex-1 flex items-center gap-2">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-purple-400 to-pink-500"></div>
            <span class="text-sm font-medium text-gray-900">付费广告</span>
          </div>
          <div class="w-16 text-sm text-right text-gray-700">2,856</div>
          <div class="w-16 text-sm text-right font-medium text-red-500">2.8%</div>
        </div>

        <div class="flex items-center px-4 py-3">
          <div class="w-10 text-sm text-gray-400 font-medium">4</div>
          <div class="flex-1 flex items-center gap-2">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-orange-400 to-red-500"></div>
            <span class="text-sm font-medium text-gray-900">邮件营销</span>
          </div>
          <div class="w-16 text-sm text-right text-gray-700">1,432</div>
          <div class="w-16 text-sm text-right font-medium text-green-500">3.5%</div>
        </div>

        <div class="flex items-center px-4 py-3">
          <div class="w-10 text-sm text-gray-400 font-medium">5</div>
          <div class="flex-1 flex items-center gap-2">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-cyan-400 to-teal-500"></div>
            <span class="text-sm font-medium text-gray-900">直接访问</span>
          </div>
          <div class="w-16 text-sm text-right text-gray-700">932</div>
          <div class="w-16 text-sm text-right font-medium text-green-500">4.8%</div>
        </div>
      </div>

      <!-- Footer -->
      <div class="bg-gray-50 px-4 py-2.5 flex items-center justify-between text-xs text-gray-400">
        <span>共 12 个渠道</span>
        <button class="text-blue-500 font-medium">查看全部</button>
      </div>
    </div>
  </div>

  <!-- Quick actions -->
  <div class="px-4 mt-4 mb-4">
    <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-2xl p-5 text-white">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-semibold">生成数据报表</div>
          <div class="text-sm text-blue-100 mt-1">一键导出本月详细数据</div>
        </div>
        <button class="px-4 py-2 bg-white text-blue-600 text-sm font-semibold rounded-xl">
          立即生成
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-100">
    <div class="flex items-center py-2 pb-6">
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-blue-500" fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span class="text-xs mt-1 text-blue-500 font-medium">看板</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span class="text-xs mt-1 text-gray-400">报表</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-xs mt-1 text-gray-400">财务</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs mt-1 text-gray-400">我的</span>
      </div>
    </div>
  </div>
</body>
</html>
