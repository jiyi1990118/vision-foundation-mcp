<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Tabs Music</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-900 text-white pb-20">
  <!-- Status bar -->
  <div class="status-bar flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Header -->
  <div class="px-5 py-3 flex items-center justify-between">
    <h1 class="text-xl font-bold">音乐</h1>
    <div class="flex items-center gap-3">
      <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-pink-500 to-red-500"></div>
    </div>
  </div>

  <!-- Top tabs (category) -->
  <div class="px-5 py-2 flex gap-4 overflow-x-auto">
    <button class="flex-shrink-0 text-lg font-bold text-white">推荐</button>
    <button class="flex-shrink-0 text-lg font-medium text-gray-500">歌单</button>
    <button class="flex-shrink-0 text-lg font-medium text-gray-500">排行榜</button>
    <button class="flex-shrink-0 text-lg font-medium text-gray-500">歌手</button>
    <button class="flex-shrink-0 text-lg font-medium text-gray-500">电台</button>
    <button class="flex-shrink-0 text-lg font-medium text-gray-500">直播</button>
  </div>

  <!-- Sub tabs (filters) -->
  <div class="px-5 py-3 flex gap-2">
    <button class="flex-shrink-0 px-4 py-1.5 text-sm font-medium bg-pink-500 text-white rounded-full">全部</button>
    <button class="flex-shrink-0 px-4 py-1.5 text-sm font-medium bg-gray-800 text-gray-400 rounded-full">流行</button>
    <button class="flex-shrink-0 px-4 py-1.5 text-sm font-medium bg-gray-800 text-gray-400 rounded-full">摇滚</button>
    <button class="flex-shrink-0 px-4 py-1.5 text-sm font-medium bg-gray-800 text-gray-400 rounded-full">电子</button>
    <button class="flex-shrink-0 px-4 py-1.5 text-sm font-medium bg-gray-800 text-gray-400 rounded-full">民谣</button>
  </div>

  <!-- Featured playlist -->
  <div class="px-5 mt-2">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold text-lg">精选歌单</h2>
      <button class="text-sm text-gray-400">更多 →</button>
    </div>
    <div class="grid grid-cols-3 gap-3">
      <div>
        <div class="aspect-square rounded-xl bg-gradient-to-br from-pink-500 to-red-600 flex items-center justify-center text-3xl">🎵</div>
        <p class="text-xs text-gray-300 mt-1.5 line-clamp-2">华语流行热歌榜</p>
      </div>
      <div>
        <div class="aspect-square rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-3xl">🎸</div>
        <p class="text-xs text-gray-300 mt-1.5 line-clamp-2">英文摇滚经典</p>
      </div>
      <div>
        <div class="aspect-square rounded-xl bg-gradient-to-br from-green-400 to-teal-600 flex items-center justify-center text-3xl">🎹</div>
        <p class="text-xs text-gray-300 mt-1.5 line-clamp-2">轻音乐纯享</p>
      </div>
    </div>
  </div>

  <!-- Song list tabs -->
  <div class="px-5 mt-6">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold text-lg">热门歌曲</h2>
      <div class="flex gap-1">
        <button class="px-3 py-1 text-xs font-medium bg-pink-500/20 text-pink-400 rounded-full">日榜</button>
        <button class="px-3 py-1 text-xs font-medium text-gray-500 rounded-full">周榜</button>
        <button class="px-3 py-1 text-xs font-medium text-gray-500 rounded-full">总榜</button>
      </div>
    </div>

    <!-- Song items -->
    <div class="space-y-1">
      <div class="flex items-center py-2.5">
        <span class="w-6 text-sm text-gray-500 font-medium">1</span>
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-orange-400 to-red-500 ml-2 flex items-center justify-center text-lg">🎶</div>
        <div class="ml-3 flex-1 min-w-0">
          <p class="text-sm font-medium truncate">夜空中最亮的星</p>
          <p class="text-xs text-gray-500 truncate mt-0.5">逃跑计划</p>
        </div>
        <button class="w-6 h-6 text-gray-400">⋮</button>
      </div>
      <div class="flex items-center py-2.5">
        <span class="w-6 text-sm text-gray-500 font-medium">2</span>
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-400 to-indigo-500 ml-2 flex items-center justify-center text-lg">🎤</div>
        <div class="ml-3 flex-1 min-w-0">
          <p class="text-sm font-medium truncate">光年之外</p>
          <p class="text-xs text-gray-500 truncate mt-0.5">邓紫棋</p>
        </div>
        <button class="w-6 h-6 text-gray-400">⋮</button>
      </div>
      <div class="flex items-center py-2.5">
        <span class="w-6 text-sm text-gray-500 font-medium">3</span>
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-purple-400 to-pink-500 ml-2 flex items-center justify-center text-lg">🎧</div>
        <div class="ml-3 flex-1 min-w-0">
          <p class="text-sm font-medium truncate">起风了</p>
          <p class="text-xs text-gray-500 truncate mt-0.5">买辣椒也用券</p>
        </div>
        <button class="w-6 h-6 text-gray-400">⋮</button>
      </div>
      <div class="flex items-center py-2.5">
        <span class="w-6 text-sm text-gray-500 font-medium">4</span>
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-green-400 to-emerald-600 ml-2 flex items-center justify-center text-lg">🎻</div>
        <div class="ml-3 flex-1 min-w-0">
          <p class="text-sm font-medium truncate">平凡之路</p>
          <p class="text-xs text-gray-500 truncate mt-0.5">朴树</p>
        </div>
        <button class="w-6 h-6 text-gray-400">⋮</button>
      </div>
      <div class="flex items-center py-2.5">
        <span class="w-6 text-sm text-gray-500 font-medium">5</span>
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-yellow-400 to-orange-500 ml-2 flex items-center justify-center text-lg">🥁</div>
        <div class="ml-3 flex-1 min-w-0">
          <p class="text-sm font-medium truncate">晴天</p>
          <p class="text-xs text-gray-500 truncate mt-0.5">周杰伦</p>
        </div>
        <button class="w-6 h-6 text-gray-400">⋮</button>
      </div>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <div class="fixed bottom-0 left-0 w-full bg-gray-900/95 backdrop-blur border-t border-gray-800">
    <div class="flex items-center pt-2 pb-6">
      <button class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-pink-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span class="text-xs mt-1 text-pink-500 font-medium">音乐</span>
      </button>
      <button class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
        <span class="text-xs mt-1 text-gray-500">发现</span>
      </button>
      <button class="flex-1 flex flex-col items-center">
        <div class="w-10 h-10 -mt-3 rounded-full bg-gradient-to-r from-pink-500 to-red-500 flex items-center justify-center shadow-lg shadow-pink-500/30">
          <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </button>
      <button class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span class="text-xs mt-1 text-gray-500">歌单</span>
      </button>
      <button class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs mt-1 text-gray-500">我的</span>
      </button>
    </div>
  </div>
</body>
</html>
