<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>

</head>
<body class="bg-gray-50 pb-20">
  <!-- Status bar -->

  <!-- Header -->

    <div class="flex items-center gap-3">
      <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <div class="relative">

  <!-- Story bar -->
  <div class="bg-white px-5 py-4 border-b border-gray-100">
    <div class="flex gap-3 overflow-x-auto">
      <!-- Add story -->
      <div class="flex flex-col items-center flex-shrink-0">

      <!-- Story 2 -->
      <div class="flex flex-col items-center flex-shrink-0">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-yellow-400 via-orange-500 to-red-500 p-0.5">
          <div class="w-full h-full rounded-full bg-white p-0.5">
            <div class="w-full h-full rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-white font-bold">王</div>
          </div>
        </div>
        <span class="text-xs text-gray-700 mt-1.5">小王</span>
      </div>
      <!-- Story 3 -->
      <div class="flex flex-col items-center flex-shrink-0">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-purple-400 via-pink-500 to-red-500 p-0.5">

        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-green-400 via-teal-500 to-blue-500 p-0.5">

            <div class="w-full h-full rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-white font-bold">赵</div>

        </div>

        <button class="text-gray-400">⋯</button>

      <p class="text-sm text-gray-800 mt-3 leading-relaxed">今天的晚霞太美了！在阳台上拍了几张，分享给大家看看 🌅 #晚霞 #摄影 #日常</p>

      <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-50">
        <div class="flex items-center gap-6">
          <div class="flex items-center gap-1.5 text-gray-500 text-sm">

    <div class="flex items-center py-2 pb-6">
      <button class="flex-1 flex flex-col items-center">
