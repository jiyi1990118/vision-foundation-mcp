<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Buttons Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-white">
  <!-- Status bar -->
  <div class="status-bar flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Logo area -->
  <div class="flex flex-col items-center pt-16 pb-8">
    <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-3xl font-bold">
      A
    </div>
    <h1 class="text-2xl font-bold mt-4">欢迎回来</h1>
    <p class="text-gray-400 text-sm mt-2">登录你的账号继续使用</p>
  </div>

  <!-- Login form -->
  <div class="px-8">
    <!-- Email input -->
    <div class="mb-4">
      <label class="text-sm font-medium text-gray-700 mb-2 block">邮箱地址</label>
      <div class="border border-gray-200 rounded-xl px-4 py-3 flex items-center">
        <span class="text-gray-400 mr-2">✉️</span>
        <input type="email" value="user@example.com" class="flex-1 outline-none text-gray-900" />
      </div>
    </div>

    <!-- Password input -->
    <div class="mb-4">
      <label class="text-sm font-medium text-gray-700 mb-2 block">密码</label>
      <div class="border border-gray-200 rounded-xl px-4 py-3 flex items-center">
        <span class="text-gray-400 mr-2">🔒</span>
        <input type="password" value="••••••••" class="flex-1 outline-none text-gray-900" />
        <span class="text-blue-500 text-sm font-medium">显示</span>
      </div>
    </div>

    <!-- Remember + forgot -->
    <div class="flex items-center justify-between mb-6">
      <label class="flex items-center text-sm text-gray-600">
        <input type="checkbox" checked class="mr-2" />
        记住我
      </label>
      <button class="text-sm text-blue-500 font-medium">忘记密码？</button>
    </div>

    <!-- Primary buttons -->
    <button class="w-full py-3.5 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/30">
      登录
    </button>

    <button class="w-full py-3.5 mt-3 bg-gray-100 text-gray-700 font-semibold rounded-xl">
      注册新账号
    </button>

    <!-- Divider -->
    <div class="flex items-center my-6">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="px-4 text-sm text-gray-400">其他登录方式</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <!-- Social login buttons -->
    <div class="grid grid-cols-3 gap-3">
      <button class="py-3 border border-gray-200 rounded-xl flex items-center justify-center">
        <span class="text-xl">📱</span>
      </button>
      <button class="py-3 border border-gray-200 rounded-xl flex items-center justify-center">
        <span class="text-xl">💬</span>
      </button>
      <button class="py-3 border border-gray-200 rounded-xl flex items-center justify-center">
        <span class="text-xl">🐦</span>
      </button>
    </div>

    <!-- More action buttons -->
    <div class="mt-6 space-y-3">
      <button class="w-full py-3 text-sm text-gray-500 font-medium flex items-center justify-center">
        <span>游客模式浏览</span>
        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <!-- Bottom links -->
  <div class="fixed bottom-8 left-0 w-full flex justify-center gap-4 text-sm text-gray-400">
    <button class="font-medium">用户协议</button>
    <span>·</span>
    <button class="font-medium">隐私政策</button>
    <span>·</span>
    <button class="font-medium">帮助中心</button>
  </div>
</body>
</html>
