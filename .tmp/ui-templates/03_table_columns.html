<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Table Columns</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-50">
  <!-- Status bar -->
  <div class="status-bar bg-white flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Header -->
  <div class="bg-white px-5 py-4 border-b border-gray-100">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold">数据报表</h1>
        <p class="text-sm text-gray-400 mt-0.5">2026年7月销售数据</p>
      </div>
      <div class="flex items-center gap-2">
        <button class="px-3 py-1.5 text-sm bg-blue-50 text-blue-600 font-medium rounded-lg">导出</button>
      </div>
    </div>
  </div>

  <!-- Summary cards -->
  <div class="px-4 py-3 grid grid-cols-3 gap-2">
    <div class="bg-white rounded-xl p-3 shadow-sm">
      <div class="text-xs text-gray-400">总销售额</div>
      <div class="text-lg font-bold text-gray-900 mt-1">¥128K</div>
      <div class="text-xs text-green-500 mt-0.5">↑ 12.5%</div>
    </div>
    <div class="bg-white rounded-xl p-3 shadow-sm">
      <div class="text-xs text-gray-400">订单数</div>
      <div class="text-lg font-bold text-gray-900 mt-1">1,284</div>
      <div class="text-xs text-green-500 mt-0.5">↑ 8.3%</div>
    </div>
    <div class="bg-white rounded-xl p-3 shadow-sm">
      <div class="text-xs text-gray-400">客单价</div>
      <div class="text-lg font-bold text-gray-900 mt-1">¥99.7</div>
      <div class="text-xs text-red-500 mt-0.5">↓ 2.1%</div>
    </div>
  </div>

  <!-- Table -->
  <div class="px-4 py-3">
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
        <span class="font-semibold text-gray-900">热销商品排行</span>
        <span class="text-xs text-gray-400">TOP 10</span>
      </div>

      <!-- Table header -->
      <div class="flex bg-gray-50 px-4 py-2.5 text-xs font-medium text-gray-500">
        <div class="w-8 text-gray-400">#</div>
        <div class="flex-1">商品名称</div>
        <div class="w-20 text-right">销量</div>
        <div class="w-20 text-right">销售额</div>
      </div>

      <!-- Table rows -->
      <div class="divide-y divide-gray-50">
        <div class="flex items-center px-4 py-3">
          <div class="w-8">
            <span class="w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">1</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">无线蓝牙耳机 Pro</div>
          </div>
          <div class="w-20 text-sm text-gray-700 text-right">328</div>
          <div class="w-20 text-sm font-medium text-gray-900 text-right">¥19.6K</div>
        </div>

        <div class="flex items-center px-4 py-3">
          <div class="w-8">
            <span class="w-5 h-5 bg-orange-500 text-white text-xs font-bold rounded-full flex items-center justify-center">2</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">智能手表 S8</div>
          </div>
          <div class="w-20 text-sm text-gray-700 text-right">256</div>
          <div class="w-20 text-sm font-medium text-gray-900 text-right">¥18.0K</div>
        </div>

        <div class="flex items-center px-4 py-3">
          <div class="w-8">
            <span class="w-5 h-5 bg-yellow-500 text-white text-xs font-bold rounded-full flex items-center justify-center">3</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">运动跑步鞋 Air</div>
          </div>
          <div class="w-20 text-sm text-gray-700 text-right">194</div>
          <div class="w-20 text-sm font-medium text-gray-900 text-right">¥15.5K</div>
        </div>

        <div class="flex items-center px-4 py-3">
          <div class="w-8 text-sm text-gray-400 font-medium">4</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">保温杯 500ml</div>
          </div>
          <div class="w-20 text-sm text-gray-700 text-right">156</div>
          <div class="w-20 text-sm font-medium text-gray-900 text-right">¥7.8K</div>
        </div>

        <div class="flex items-center px-4 py-3">
          <div class="w-8 text-sm text-gray-400 font-medium">5</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">无线充电器</div>
          </div>
          <div class="w-20 text-sm text-gray-700 text-right">142</div>
          <div class="w-20 text-sm font-medium text-gray-900 text-right">¥4.2K</div>
        </div>

        <div class="flex items-center px-4 py-3">
          <div class="w-8 text-sm text-gray-400 font-medium">6</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">笔记本电脑支架</div>
          </div>
          <div class="w-20 text-sm text-gray-700 text-right">98</div>
          <div class="w-20 text-sm font-medium text-gray-900 text-right">¥2.9K</div>
        </div>

        <div class="flex items-center px-4 py-3">
          <div class="w-8 text-sm text-gray-400 font-medium">7</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">机械键盘 87键</div>
          </div>
          <div class="w-20 text-sm text-gray-700 text-right">86</div>
          <div class="w-20 text-sm font-medium text-gray-900 text-right">¥4.3K</div>
        </div>
      </div>

      <!-- Table footer -->
      <div class="bg-gray-50 px-4 py-2.5 flex items-center justify-between text-xs text-gray-400">
        <span>共 36 个商品</span>
        <span>点击查看全部 →</span>
      </div>
    </div>
  </div>
</body>
</html>
