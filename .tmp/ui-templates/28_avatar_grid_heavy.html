<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Avatar Grid Heavy</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-50">
  <!-- Status bar -->
  <div class="status-bar bg-white flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Header -->
  <div class="bg-white px-5 py-4 border-b border-gray-100 flex items-center justify-between">
    <h1 class="text-xl font-bold">好友</h1>
    <div class="flex items-center gap-4">
      <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500"></div>
    </div>
  </div>

  <!-- New friends section -->
  <div class="bg-white mt-2">
    <div class="px-5 py-2.5 bg-gray-50 text-xs font-bold text-gray-400 border-b border-gray-100">
      新朋友
    </div>
    <div class="flex items-center px-5 py-3 border-b border-gray-50">
      <div class="relative">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-pink-400 to-red-500 flex items-center justify-center text-white font-bold">林</div>
        <span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 bg-green-500 text-white text-xs rounded-full flex items-center justify-center border-2 border-white">+</span>
      </div>
      <div class="ml-3 flex-1">
        <div class="font-medium text-gray-900">林小雨</div>
        <div class="text-xs text-gray-400 mt-0.5">共同好友 5 人</div>
      </div>
      <button class="px-4 py-1.5 text-sm font-semibold text-white bg-blue-500 rounded-lg">接受</button>
    </div>
    <div class="flex items-center px-5 py-3">
      <div class="relative">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-cyan-400 to-blue-500 flex items-center justify-center text-white font-bold">何</div>
        <span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 bg-green-500 text-white text-xs rounded-full flex items-center justify-center border-2 border-white">+</span>
      </div>
      <div class="ml-3 flex-1">
        <div class="font-medium text-gray-900">何大海</div>
        <div class="text-xs text-gray-400 mt-0.5">来自群聊：技术分享</div>
      </div>
      <button class="px-4 py-1.5 text-sm font-semibold text-white bg-blue-500 rounded-lg">接受</button>
    </div>
  </div>

  <!-- Online section -->
  <div class="bg-white mt-2">
    <div class="px-5 py-2.5 bg-gray-50 text-xs font-bold text-gray-400 border-b border-gray-100 flex items-center justify-between">
      <span>在线好友 · 24人</span>
      <span class="text-blue-500">全部</span>
    </div>
    <!-- Avatar grid row 1 -->
    <div class="px-5 py-3 grid grid-cols-6 gap-3">
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-red-400 to-pink-500 flex items-center justify-center text-white text-sm font-bold">李</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">李明</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-white text-sm font-bold">王</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">王芳</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-green-400 to-teal-500 flex items-center justify-center text-white text-sm font-bold">张</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">张伟</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-400 to-pink-500 flex items-center justify-center text-white text-sm font-bold">刘</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">刘洋</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-orange-400 to-red-500 flex items-center justify-center text-white text-sm font-bold">陈</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">陈静</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-white text-sm font-bold">赵</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">赵磊</span>
      </div>
    </div>
    <!-- Avatar grid row 2 -->
    <div class="px-5 pb-3 grid grid-cols-6 gap-3">
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-400 to-teal-500 flex items-center justify-center text-white text-sm font-bold">孙</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">孙悦</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center text-white text-sm font-bold">周</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">周杰</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white text-sm font-bold">吴</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">吴婷</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-400 to-yellow-500 flex items-center justify-center text-white text-sm font-bold">郑</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">郑恺</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-emerald-400 to-green-500 flex items-center justify-center text-white text-sm font-bold">冯</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">冯巩</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-rose-400 to-red-500 flex items-center justify-center text-white text-sm font-bold">钱</div>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-yellow-400 border-2 border-white rounded-full"></span>
        </div>
        <span class="text-xs text-gray-600 mt-1 truncate w-full text-center">钱多多</span>
      </div>
    </div>
  </div>

  <!-- All friends list -->
  <div class="bg-white mt-2 mb-8">
    <div class="px-5 py-2.5 bg-gray-50 text-xs font-bold text-gray-400 border-b border-gray-100">
      全部好友 · 128人
    </div>

    <div class="divide-y divide-gray-50">
      <div class="flex items-center px-5 py-3">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-blue-400 to-cyan-500 flex items-center justify-center text-white font-bold">安</div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-900">安娜</div>
          <div class="text-xs text-gray-400 mt-0.5">设计师 · 上海</div>
        </div>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-purple-400 to-indigo-500 flex items-center justify-center text-white font-bold">白</div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-900">白宇</div>
          <div class="text-xs text-gray-400 mt-0.5">程序员 · 北京</div>
        </div>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-green-400 to-emerald-500 flex items-center justify-center text-white font-bold">蔡</div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-900">蔡徐</div>
          <div class="text-xs text-gray-400 mt-0.5">歌手 · 深圳</div>
        </div>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-red-400 to-orange-500 flex items-center justify-center text-white font-bold">邓</div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-900">邓超</div>
          <div class="text-xs text-gray-400 mt-0.5">演员 · 北京</div>
        </div>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-pink-400 to-fuchsia-500 flex items-center justify-center text-white font-bold">董</div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-900">董卿</div>
          <div class="text-xs text-gray-400 mt-0.5">主持人 · 上海</div>
        </div>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-teal-400 to-cyan-500 flex items-center justify-center text-white font-bold">杜</div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-900">杜江</div>
          <div class="text-xs text-gray-400 mt-0.5">演员 · 北京</div>
        </div>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-yellow-400 to-amber-500 flex items-center justify-center text-white font-bold">段</div>
        <div class="ml-3 flex-1">
          <div class="font-medium text-gray-900">段誉</div>
          <div class="text-xs text-gray-400 mt-0.5">武侠 · 大理</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
