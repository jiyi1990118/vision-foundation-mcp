<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Avatar List</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-50">
  <!-- Status bar -->
  <div class="status-bar bg-white flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Header -->
  <div class="bg-white px-5 py-4 border-b border-gray-100">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold">联系人</h1>
      <div class="flex items-center gap-4">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
      </div>
    </div>

    <!-- Search bar -->
    <div class="mt-4 flex items-center bg-gray-100 rounded-xl px-4 py-2.5">
      <svg class="w-5 h-5 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <span class="text-sm text-gray-400">搜索联系人</span>
    </div>
  </div>

  <!-- Section: Online friends -->
  <div class="mt-4">
    <div class="px-5 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wide">在线好友 (12)</div>

    <!-- Friend 1 - online -->
    <div class="bg-white flex items-center px-5 py-3 border-b border-gray-50">
      <div class="relative">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center text-white font-bold text-lg">李</div>
        <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="font-medium text-gray-900">李明轩</div>
        <div class="text-sm text-gray-400 truncate">产品经理 @ 字节跳动</div>
      </div>
      <span class="px-2 py-0.5 text-xs font-semibold bg-green-100 text-green-600 rounded-full">在线</span>
    </div>

    <!-- Friend 2 -->
    <div class="bg-white flex items-center px-5 py-3 border-b border-gray-50">
      <div class="relative">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-white font-bold text-lg">王</div>
        <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="font-medium text-gray-900">王思琪</div>
        <div class="text-sm text-gray-400 truncate">UI 设计师 @ 腾讯</div>
      </div>
      <div class="relative">
        <span class="px-2 py-0.5 text-xs font-semibold bg-green-100 text-green-600 rounded-full">在线</span>
      </div>
    </div>

    <!-- Friend 3 -->
    <div class="bg-white flex items-center px-5 py-3 border-b border-gray-50">
      <div class="relative">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-400 to-violet-500 flex items-center justify-center text-white font-bold text-lg">张</div>
        <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="font-medium text-gray-900">张雅琳</div>
        <div class="text-sm text-gray-400 truncate">前端工程师 @ 阿里巴巴</div>
      </div>
      <span class="px-2 py-0.5 text-xs font-semibold bg-green-100 text-green-600 rounded-full">在线</span>
    </div>

    <!-- Friend 4 with badge -->
    <div class="bg-blue-50 flex items-center px-5 py-3 border-b border-gray-50">
      <div class="relative">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-orange-400 to-amber-500 flex items-center justify-center text-white font-bold text-lg">陈</div>
        <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
        <div class="absolute -top-1 -left-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">3</div>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="font-semibold text-gray-900">陈志远</div>
        <div class="text-sm text-blue-600 truncate">发来了3条新消息</div>
      </div>
      <span class="px-2 py-0.5 text-xs font-semibold bg-blue-500 text-white rounded-full">消息</span>
    </div>
  </div>

  <!-- Section: Groups -->
  <div class="mt-4">
    <div class="px-5 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wide">群组 (6)</div>

    <!-- Group 1 -->
    <div class="bg-white flex items-center px-5 py-3 border-b border-gray-50">
      <div class="relative w-12 h-12">
        <div class="absolute top-0 left-0 w-6 h-6 rounded-full bg-gradient-to-br from-teal-400 to-cyan-500 border-2 border-white"></div>
        <div class="absolute bottom-0 right-0 w-6 h-6 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 border-2 border-white"></div>
        <div class="absolute top-0 right-0 w-6 h-6 rounded-full bg-gradient-to-br from-indigo-400 to-blue-500 border-2 border-white"></div>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center">
          <span class="font-medium text-gray-900">产品设计讨论组</span>
          <span class="ml-2 px-1.5 py-0.5 text-xs font-semibold bg-red-100 text-red-600 rounded">99+</span>
        </div>
        <div class="text-sm text-gray-400 truncate">李明轩: 新的设计稿已经上传了</div>
      </div>
    </div>

    <!-- Group 2 -->
    <div class="bg-white flex items-center px-5 py-3 border-b border-gray-50">
      <div class="relative w-12 h-12">
        <div class="absolute top-0 left-0 w-6 h-6 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 border-2 border-white"></div>
        <div class="absolute bottom-0 right-0 w-6 h-6 rounded-full bg-gradient-to-br from-emerald-400 to-green-500 border-2 border-white"></div>
        <div class="absolute top-0 right-0 w-6 h-6 rounded-full bg-gradient-to-br from-violet-400 to-purple-500 border-2 border-white"></div>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center">
          <span class="font-medium text-gray-900">技术分享群</span>
          <span class="ml-2 px-1.5 py-0.5 text-xs font-semibold bg-orange-100 text-orange-600 rounded">12</span>
        </div>
        <div class="text-sm text-gray-400 truncate">张雅琳: React 19 新特性分享</div>
      </div>
    </div>

    <!-- Group 3 -->
    <div class="bg-white flex items-center px-5 py-3">
      <div class="relative w-12 h-12">
        <div class="absolute top-0 left-0 w-6 h-6 rounded-full bg-gradient-to-br from-rose-400 to-pink-500 border-2 border-white"></div>
        <div class="absolute bottom-0 right-0 w-6 h-6 rounded-full bg-gradient-to-br from-sky-400 to-blue-500 border-2 border-white"></div>
        <div class="absolute top-0 right-0 w-6 h-6 rounded-full bg-gradient-to-br from-lime-400 to-green-500 border-2 border-white"></div>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <span class="font-medium text-gray-900">健身打卡群</span>
        <div class="text-sm text-gray-400 truncate">今日打卡 8 人，继续加油！</div>
      </div>
    </div>
  </div>
</body>
</html>
