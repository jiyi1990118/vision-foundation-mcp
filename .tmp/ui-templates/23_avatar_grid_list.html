<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Avatar Grid List</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-50">
  <!-- Status bar -->
  <div class="status-bar bg-white flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Header -->
  <div class="bg-white px-5 py-4 border-b border-gray-100 flex items-center justify-between">
    <h1 class="text-xl font-bold">通讯录</h1>
    <div class="flex items-center gap-4">
      <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500"></div>
    </div>
  </div>

  <!-- Search -->
  <div class="bg-white px-5 py-3 border-b border-gray-100">
    <div class="flex items-center bg-gray-100 rounded-xl px-4 py-2.5">
      <svg class="w-5 h-5 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <span class="text-sm text-gray-400">搜索联系人</span>
    </div>
  </div>

  <!-- Featured avatars grid -->
  <div class="bg-white px-5 py-4 border-b border-gray-100">
    <h3 class="text-sm font-semibold text-gray-900 mb-3">星标好友</h3>
    <div class="grid grid-cols-4 gap-3">
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-pink-400 to-red-500 flex items-center justify-center text-white font-bold">李</div>
          <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
        </div>
        <span class="text-xs text-gray-700 mt-1.5">李明</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-white font-bold">王</div>
          <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
        </div>
        <span class="text-xs text-gray-700 mt-1.5">王芳</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-green-400 to-teal-500 flex items-center justify-center text-white font-bold">张</div>
        </div>
        <span class="text-xs text-gray-700 mt-1.5">张伟</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="relative">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-400 to-pink-500 flex items-center justify-center text-white font-bold">刘</div>
          <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
        </div>
        <span class="text-xs text-gray-700 mt-1.5">刘洋</span>
      </div>
    </div>
  </div>

  <!-- List section A -->
  <div class="bg-white">
    <div class="px-5 py-2 bg-gray-50 text-xs font-bold text-gray-400">A</div>
    <div class="divide-y divide-gray-50">
      <div class="flex items-center px-5 py-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-orange-400 to-red-500 flex items-center justify-center text-white font-bold">安</div>
        <div class="ml-3">
          <span class="font-medium text-gray-900">安娜</span>
          <p class="text-xs text-gray-400 mt-0.5">设计师 · 上海</p>
        </div>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-cyan-500 flex items-center justify-center text-white font-bold">艾</div>
        <div class="ml-3">
          <span class="font-medium text-gray-900">艾米</span>
          <p class="text-xs text-gray-400 mt-0.5">产品经理 · 北京</p>
        </div>
      </div>
    </div>
  </div>

  <!-- List section C -->
  <div class="bg-white mt-2">
    <div class="px-5 py-2 bg-gray-50 text-xs font-bold text-gray-400">C</div>
    <div class="divide-y divide-gray-50">
      <div class="flex items-center px-5 py-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-red-400 to-pink-500 flex items-center justify-center text-white font-bold">陈</div>
        <div class="ml-3">
          <span class="font-medium text-gray-900">陈静</span>
          <p class="text-xs text-gray-400 mt-0.5">运营 · 深圳</p>
        </div>
        <span class="ml-auto text-xs px-2 py-0.5 bg-green-100 text-green-600 rounded-full">在线</span>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-white font-bold">崔</div>
        <div class="ml-3">
          <span class="font-medium text-gray-900">崔浩</span>
          <p class="text-xs text-gray-400 mt-0.5">工程师 · 杭州</p>
        </div>
      </div>
    </div>
  </div>

  <!-- List section L -->
  <div class="bg-white mt-2">
    <div class="px-5 py-2 bg-gray-50 text-xs font-bold text-gray-400">L</div>
    <div class="divide-y divide-gray-50">
      <div class="flex items-center px-5 py-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-bold">李</div>
        <div class="ml-3">
          <span class="font-medium text-gray-900">李娜</span>
          <p class="text-xs text-gray-400 mt-0.5">老师 · 广州</p>
        </div>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-teal-400 to-green-500 flex items-center justify-center text-white font-bold">林</div>
        <div class="ml-3">
          <span class="font-medium text-gray-900">林风</span>
          <p class="text-xs text-gray-400 mt-0.5">摄影师 · 成都</p>
        </div>
        <span class="ml-auto text-xs px-2 py-0.5 bg-blue-100 text-blue-600 rounded-full">忙碌</span>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-rose-400 to-red-500 flex items-center justify-center text-white font-bold">刘</div>
        <div class="ml-3">
          <span class="font-medium text-gray-900">刘强</span>
          <p class="text-xs text-gray-400 mt-0.5">销售 · 武汉</p>
        </div>
      </div>
    </div>
  </div>

  <!-- List section W -->
  <div class="bg-white mt-2 mb-8">
    <div class="px-5 py-2 bg-gray-50 text-xs font-bold text-gray-400">W</div>
    <div class="divide-y divide-gray-50">
      <div class="flex items-center px-5 py-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-400 to-blue-500 flex items-center justify-center text-white font-bold">王</div>
        <div class="ml-3">
          <span class="font-medium text-gray-900">王磊</span>
          <p class="text-xs text-gray-400 mt-0.5">律师 · 北京</p>
        </div>
      </div>
      <div class="flex items-center px-5 py-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-400 to-yellow-500 flex items-center justify-center text-white font-bold">吴</div>
        <div class="ml-3">
          <span class="font-medium text-gray-900">吴敏</span>
          <p class="text-xs text-gray-400 mt-0.5">医生 · 上海</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
