<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Bottom Sheets</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-900 text-white">
  <!-- Status bar -->
  <div class="status-bar flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Background -->
  <div class="relative" style="height: 700px;">
    <!-- Map background -->
    <div class="absolute inset-0 bg-gradient-to-br from-slate-700 via-slate-800 to-slate-900">
      <div class="absolute top-20 left-10 w-24 h-24 rounded-full bg-blue-500/20 blur-xl"></div>
      <div class="absolute top-40 right-20 w-32 h-32 rounded-full bg-purple-500/20 blur-xl"></div>
      <div class="absolute bottom-40 left-20 w-20 h-20 rounded-full bg-green-500/20 blur-xl"></div>
      <!-- Fake roads -->
      <div class="absolute top-1/3 left-0 right-0 h-1 bg-slate-600/50"></div>
      <div class="absolute top-1/2 left-0 right-0 h-1 bg-slate-600/50"></div>
      <div class="absolute left-1/4 top-0 bottom-0 w-1 bg-slate-600/50"></div>
      <div class="absolute left-2/3 top-0 bottom-0 w-1 bg-slate-600/50"></div>
      <!-- Location pins -->
      <div class="absolute top-24 left-16 w-8 h-8 -translate-x-1/2 -translate-y-full">
        <div class="w-full h-full bg-red-500 rounded-full rounded-bl-none rotate-45 shadow-lg"></div>
      </div>
      <div class="absolute top-48 right-24 w-6 h-6 -translate-x-1/2 -translate-y-full">
        <div class="w-full h-full bg-blue-500 rounded-full rounded-bl-none rotate-45"></div>
      </div>
      <div class="absolute bottom-32 left-1/3 w-6 h-6 -translate-x-1/2 -translate-y-full">
        <div class="w-full h-full bg-green-500 rounded-full rounded-bl-none rotate-45"></div>
      </div>
    </div>

    <!-- Top search bar -->
    <div class="absolute top-4 left-4 right-4">
      <div class="bg-white rounded-xl px-4 py-3 flex items-center shadow-lg">
        <svg class="w-5 h-5 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <span class="text-sm text-gray-400">搜索地点、地址</span>
      </div>
    </div>

    <!-- Category pills -->
    <div class="absolute top-16 left-4 flex gap-2">
      <span class="px-3 py-1.5 bg-white text-sm font-medium text-gray-700 rounded-full shadow">全部</span>
      <span class="px-3 py-1.5 bg-white/80 text-sm text-gray-600 rounded-full shadow">美食</span>
      <span class="px-3 py-1.5 bg-white/80 text-sm text-gray-600 rounded-full shadow">咖啡</span>
      <span class="px-3 py-1.5 bg-white/80 text-sm text-gray-600 rounded-full shadow">酒店</span>
    </div>
  </div>

  <!-- Bottom sheet (main) -->
  <div class="fixed bottom-0 left-0 w-full bg-white rounded-t-3xl shadow-2xl text-gray-900" style="height: 380px;">
    <!-- Drag handle -->
    <div class="flex justify-center pt-3 pb-2">
      <div class="w-10 h-1 bg-gray-300 rounded-full"></div>
    </div>

    <!-- Sheet header -->
    <div class="px-5 py-2 flex items-center justify-between">
      <div>
        <h2 class="text-lg font-bold">附近推荐</h2>
        <p class="text-xs text-gray-400 mt-0.5">为你找到 24 个地点</p>
      </div>
      <button class="px-3 py-1.5 text-sm text-blue-500 font-medium bg-blue-50 rounded-lg">
        筛选
      </button>
    </div>

    <!-- Place list -->
    <div class="overflow-y-auto" style="height: 290px;">
      <div class="px-5 py-3 border-b border-gray-50 flex items-center">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-orange-400 to-red-500 flex items-center justify-center text-2xl flex-shrink-0">🍜</div>
        <div class="ml-3 flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-gray-900">老北京炸酱面</span>
            <span class="px-1.5 py-0.5 text-xs bg-orange-100 text-orange-600 rounded font-medium">热门</span>
          </div>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-sm text-yellow-500 font-medium">★ 4.8</span>
            <span class="text-xs text-gray-400">· 500m</span>
            <span class="text-xs text-gray-400">· ¥45/人</span>
          </div>
          <div class="text-xs text-gray-400 mt-1 truncate">面条 / 北京菜 / 王府井</div>
        </div>
      </div>

      <div class="px-5 py-3 border-b border-gray-50 flex items-center">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-green-400 to-teal-500 flex items-center justify-center text-2xl flex-shrink-0">☕</div>
        <div class="ml-3 flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-gray-900">星巴克臻选店</span>
            <span class="px-1.5 py-0.5 text-xs bg-green-100 text-green-600 rounded font-medium">新店</span>
          </div>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-sm text-yellow-500 font-medium">★ 4.6</span>
            <span class="text-xs text-gray-400">· 320m</span>
            <span class="text-xs text-gray-400">· ¥58/人</span>
          </div>
          <div class="text-xs text-gray-400 mt-1 truncate">咖啡 / 甜点 / 国贸</div>
        </div>
      </div>

      <div class="px-5 py-3 border-b border-gray-50 flex items-center">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-purple-400 to-pink-500 flex items-center justify-center text-2xl flex-shrink-0">🏨</div>
        <div class="ml-3 flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-gray-900">四季酒店</span>
            <span class="px-1.5 py-0.5 text-xs bg-purple-100 text-purple-600 rounded font-medium">五星</span>
          </div>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-sm text-yellow-500 font-medium">★ 4.9</span>
            <span class="text-xs text-gray-400">· 1.2km</span>
            <span class="text-xs text-gray-400">· ¥1288起</span>
          </div>
          <div class="text-xs text-gray-400 mt-1 truncate">豪华酒店 / 商务中心</div>
        </div>
      </div>

      <div class="px-5 py-3 border-b border-gray-50 flex items-center">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-2xl flex-shrink-0">🍣</div>
        <div class="ml-3 flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-gray-900">寿司之神</span>
          </div>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-sm text-yellow-500 font-medium">★ 4.7</span>
            <span class="text-xs text-gray-400">· 680m</span>
            <span class="text-xs text-gray-400">· ¥299/人</span>
          </div>
          <div class="text-xs text-gray-400 mt-1 truncate">日料 / 寿司 / 三里屯</div>
        </div>
      </div>

      <div class="px-5 py-3 flex items-center">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-2xl flex-shrink-0">🧁</div>
        <div class="ml-3 flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-gray-900">甜蜜时光蛋糕</span>
          </div>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-sm text-yellow-500 font-medium">★ 4.5</span>
            <span class="text-xs text-gray-400">· 450m</span>
            <span class="text-xs text-gray-400">· ¥38/人</span>
          </div>
          <div class="text-xs text-gray-400 mt-1 truncate">甜品 / 蛋糕 / 望京</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
