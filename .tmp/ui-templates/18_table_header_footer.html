<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Data Table H/F</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-50">
  <!-- Status bar -->
  <div class="status-bar bg-white flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Header -->
  <div class="bg-white px-5 py-4 border-b border-gray-100 flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold">我的订单</h1>
      <p class="text-sm text-gray-400 mt-0.5">2026年7月订单明细</p>
    </div>
    <button class="px-3 py-1.5 text-sm bg-blue-50 text-blue-500 font-medium rounded-lg">
      导出
    </button>
  </div>

  <!-- Filter tabs header -->
  <div class="bg-white flex border-b border-gray-100 px-3">
    <button class="flex-1 py-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-500">全部</button>
    <button class="flex-1 py-3 text-sm text-gray-500">待付款</button>
    <button class="flex-1 py-3 text-sm text-gray-500">待发货</button>
    <button class="flex-1 py-3 text-sm text-gray-500">已完成</button>
    <button class="flex-1 py-3 text-sm text-gray-500">退款</button>
  </div>

  <!-- Summary header stats -->
  <div class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white mx-4 mt-4 rounded-2xl p-4">
    <div class="grid grid-cols-4 gap-2 text-center">
      <div>
        <div class="text-2xl font-bold">12</div>
        <div class="text-xs text-blue-100 mt-0.5">全部订单</div>
      </div>
      <div>
        <div class="text-2xl font-bold">2</div>
        <div class="text-xs text-blue-100 mt-0.5">待付款</div>
      </div>
      <div>
        <div class="text-2xl font-bold">3</div>
        <div class="text-xs text-blue-100 mt-0.5">待收货</div>
      </div>
      <div>
        <div class="text-2xl font-bold">7</div>
        <div class="text-xs text-blue-100 mt-0.5">已完成</div>
      </div>
    </div>
  </div>

  <!-- Orders table/list -->
  <div class="mx-4 mt-4 bg-white rounded-2xl overflow-hidden shadow-sm">
    <!-- Table header -->
    <div class="flex px-4 py-2.5 bg-gray-50 text-xs font-medium text-gray-500 border-b border-gray-100">
      <div class="flex-1">商品信息</div>
      <div class="w-20 text-right">单价</div>
      <div class="w-10 text-center">数量</div>
      <div class="w-20 text-right">状态</div>
    </div>

    <!-- Table rows -->
    <div class="divide-y divide-gray-50">
      <!-- Row 1 -->
      <div class="flex items-center px-4 py-3">
        <div class="flex-1 flex items-center min-w-0">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-red-400 to-pink-500 flex items-center justify-center text-lg flex-shrink-0">👟</div>
          <div class="ml-2 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">运动鞋 Air Max</div>
            <div class="text-xs text-gray-400 mt-0.5">黑白色 / 42码</div>
          </div>
        </div>
        <div class="w-20 text-sm text-gray-700 text-right">¥299</div>
        <div class="w-10 text-sm text-gray-600 text-center">1</div>
        <div class="w-20 text-right">
          <span class="text-xs font-medium text-orange-500 bg-orange-50 px-2 py-0.5 rounded">待付款</span>
        </div>
      </div>

      <!-- Row 2 -->
      <div class="flex items-center px-4 py-3">
        <div class="flex-1 flex items-center min-w-0">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-lg flex-shrink-0">🎧</div>
          <div class="ml-2 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">无线降噪耳机</div>
            <div class="text-xs text-gray-400 mt-0.5">星空黑 / Pro版</div>
          </div>
        </div>
        <div class="w-20 text-sm text-gray-700 text-right">¥599</div>
        <div class="w-10 text-sm text-gray-600 text-center">1</div>
        <div class="w-20 text-right">
          <span class="text-xs font-medium text-blue-500 bg-blue-50 px-2 py-0.5 rounded">待发货</span>
        </div>
      </div>

      <!-- Row 3 -->
      <div class="flex items-center px-4 py-3">
        <div class="flex-1 flex items-center min-w-0">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-green-400 to-teal-500 flex items-center justify-center text-lg flex-shrink-0">📱</div>
          <div class="ml-2 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">智能手机 Pro</div>
            <div class="text-xs text-gray-400 mt-0.5">钛金色 / 256G</div>
          </div>
        </div>
        <div class="w-20 text-sm text-gray-700 text-right">¥7999</div>
        <div class="w-10 text-sm text-gray-600 text-center">1</div>
        <div class="w-20 text-right">
          <span class="text-xs font-medium text-green-500 bg-green-50 px-2 py-0.5 rounded">已完成</span>
        </div>
      </div>

      <!-- Row 4 -->
      <div class="flex items-center px-4 py-3">
        <div class="flex-1 flex items-center min-w-0">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-purple-400 to-pink-500 flex items-center justify-center text-lg flex-shrink-0">⌚</div>
          <div class="ml-2 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">智能手表 S8</div>
            <div class="text-xs text-gray-400 mt-0.5">银色 / 42mm</div>
          </div>
        </div>
        <div class="w-20 text-sm text-gray-700 text-right">¥1299</div>
        <div class="w-10 text-sm text-gray-600 text-center">2</div>
        <div class="w-20 text-right">
          <span class="text-xs font-medium text-blue-500 bg-blue-50 px-2 py-0.5 rounded">待收货</span>
        </div>
      </div>

      <!-- Row 5 -->
      <div class="flex items-center px-4 py-3">
        <div class="flex-1 flex items-center min-w-0">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-orange-400 to-red-500 flex items-center justify-center text-lg flex-shrink-0">🎮</div>
          <div class="ml-2 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">游戏手柄</div>
            <div class="text-xs text-gray-400 mt-0.5">黑色 / 无线版</div>
          </div>
        </div>
        <div class="w-20 text-sm text-gray-700 text-right">¥259</div>
        <div class="w-10 text-sm text-gray-600 text-center">1</div>
        <div class="w-20 text-right">
          <span class="text-xs font-medium text-green-500 bg-green-50 px-2 py-0.5 rounded">已完成</span>
        </div>
      </div>

      <!-- Row 6 -->
      <div class="flex items-center px-4 py-3">
        <div class="flex-1 flex items-center min-w-0">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-lg flex-shrink-0">☕</div>
          <div class="ml-2 min-w-0">
            <div class="text-sm font-medium text-gray-900 truncate">咖啡机</div>
            <div class="text-xs text-gray-400 mt-0.5">白色 / 半自动</div>
          </div>
        </div>
        <div class="w-20 text-sm text-gray-700 text-right">¥899</div>
        <div class="w-10 text-sm text-gray-600 text-center">1</div>
        <div class="w-20 text-right">
          <span class="text-xs font-medium text-gray-400 bg-gray-100 px-2 py-0.5 rounded">已退款</span>
        </div>
      </div>
    </div>

    <!-- Table footer -->
    <div class="flex items-center justify-between px-4 py-3 bg-gray-50 border-t border-gray-100">
      <div class="text-xs text-gray-400">共 12 条记录</div>
      <div class="flex items-center gap-1">
        <button class="w-6 h-6 rounded bg-white text-gray-400 text-xs flex items-center justify-center border border-gray-200">‹</button>
        <span class="w-6 h-6 rounded bg-blue-500 text-white text-xs flex items-center justify-center">1</span>
        <button class="w-6 h-6 rounded bg-white text-gray-500 text-xs flex items-center justify-center border border-gray-200">2</button>
        <button class="w-6 h-6 rounded bg-white text-gray-400 text-xs flex items-center justify-center border border-gray-200">›</button>
      </div>
    </div>
  </div>

  <!-- Footer total -->
  <div class="mx-4 mt-4 mb-8 bg-white rounded-2xl p-4 shadow-sm">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-sm text-gray-500">本月总支出</div>
        <div class="text-2xl font-bold text-red-500 mt-0.5">¥ 11,654.00</div>
      </div>
      <button class="px-6 py-2.5 bg-blue-500 text-white text-sm font-semibold rounded-xl">
        查看账单
      </button>
    </div>
  </div>
</body>
</html>
