<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>Badge Packed</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-50">
  <!-- Status bar -->
  <div class="status-bar bg-white flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Header with multiple badges -->
  <div class="bg-white px-5 py-4 border-b border-gray-100 flex items-center justify-between">
    <h1 class="text-xl font-bold">消息</h1>
    <div class="flex items-center gap-4">
      <div class="relative">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span class="absolute -top-1 -right-1 px-1.5 py-0.5 text-xs font-bold bg-red-500 text-white rounded-full">99+</span>
      </div>
      <div class="relative">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500"></div>
        <span class="absolute -top-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-white"></span>
      </div>
    </div>
  </div>

  <!-- Tabs with badges -->
  <div class="bg-white flex border-b border-gray-100">
    <div class="flex-1 py-3 text-center border-b-2 border-blue-500">
      <div class="flex items-center justify-center">
        <span class="text-sm font-semibold text-blue-600">私信</span>
        <span class="ml-1.5 px-1.5 py-0.5 text-xs font-bold bg-red-500 text-white rounded-full">12</span>
      </div>
    </div>
    <div class="flex-1 py-3 text-center">
      <div class="flex items-center justify-center">
        <span class="text-sm text-gray-500">群聊</span>
        <span class="ml-1.5 px-1.5 py-0.5 text-xs font-bold bg-orange-500 text-white rounded-full">8</span>
      </div>
    </div>
    <div class="flex-1 py-3 text-center">
      <div class="flex items-center justify-center">
        <span class="text-sm text-gray-500">通知</span>
        <span class="ml-1.5 px-1.5 py-0.5 text-xs font-bold bg-green-500 text-white rounded-full">25</span>
      </div>
    </div>
    <div class="flex-1 py-3 text-center">
      <div class="flex items-center justify-center">
        <span class="text-sm text-gray-500">系统</span>
        <span class="ml-1.5 px-1.5 py-0.5 text-xs font-bold bg-blue-500 text-white rounded-full">3</span>
      </div>
    </div>
  </div>

  <!-- Chat list with badges -->
  <div class="bg-white">
    <div class="flex items-center px-5 py-3.5 border-b border-gray-50 bg-blue-50/30">
      <div class="relative flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-pink-400 to-red-500 flex items-center justify-center text-white font-bold">李</div>
        <span class="absolute -top-1 -right-1 px-1.5 py-0.5 text-xs font-bold bg-red-500 text-white rounded-full">99+</span>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <span class="font-semibold text-gray-900">李明轩</span>
          <span class="text-xs text-gray-400">刚刚</span>
        </div>
        <div class="text-sm text-gray-500 truncate mt-0.5">[图片] 看我刚拍的照片</div>
      </div>
    </div>

    <div class="flex items-center px-5 py-3.5 border-b border-gray-50">
      <div class="relative flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-white font-bold">设</div>
        <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">5</span>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <span class="font-medium text-gray-900">设计讨论组</span>
          <span class="text-xs text-gray-400">5分钟前</span>
        </div>
        <div class="text-sm text-gray-500 truncate mt-0.5">小王: 新的设计稿已经好了</div>
      </div>
    </div>

    <div class="flex items-center px-5 py-3.5 border-b border-gray-50">
      <div class="relative flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-green-400 to-teal-500 flex items-center justify-center text-white font-bold">产</div>
        <span class="absolute -top-1 -right-1 px-1.5 py-0.5 text-xs font-bold bg-orange-500 text-white rounded-full">15</span>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <span class="font-medium text-gray-900">产品开发群</span>
          <span class="text-xs text-gray-400">10分钟前</span>
        </div>
        <div class="text-sm text-gray-500 truncate mt-0.5">小张: 需求文档已经更新了</div>
      </div>
    </div>

    <div class="flex items-center px-5 py-3.5 border-b border-gray-50">
      <div class="relative flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-400 to-pink-500 flex items-center justify-center text-white font-bold">王</div>
        <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">2</span>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <span class="font-medium text-gray-900">王思琪</span>
          <span class="text-xs text-gray-400">30分钟前</span>
        </div>
        <div class="text-sm text-gray-500 truncate mt-0.5">好的，明天下午见</div>
      </div>
    </div>

    <div class="flex items-center px-5 py-3.5 border-b border-gray-50">
      <div class="relative flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-orange-400 to-red-500 flex items-center justify-center text-white font-bold">测</div>
        <span class="absolute -top-1 -right-1 px-1.5 py-0.5 text-xs font-bold bg-green-500 text-white rounded-full">NEW</span>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <span class="font-medium text-gray-900">测试反馈群</span>
          <span class="text-xs text-gray-400">1小时前</span>
        </div>
        <div class="text-sm text-gray-500 truncate mt-0.5">小陈: 发现一个bug需要修复</div>
      </div>
    </div>

    <div class="flex items-center px-5 py-3.5 border-b border-gray-50">
      <div class="relative flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-cyan-400 to-blue-500 flex items-center justify-center text-white font-bold">订</div>
        <span class="absolute -top-1 -right-1 px-1.5 py-0.5 text-xs font-bold bg-blue-500 text-white rounded-full">HOT</span>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <span class="font-medium text-gray-900">订单助手</span>
          <span class="text-xs text-gray-400">昨天</span>
        </div>
        <div class="text-sm text-gray-500 truncate mt-0.5">您的订单已发货</div>
      </div>
    </div>

    <div class="flex items-center px-5 py-3.5 border-b border-gray-50">
      <div class="relative flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-white font-bold">活</div>
        <span class="absolute -top-1 -right-1 px-1.5 py-0.5 text-xs font-bold bg-pink-500 text-white rounded-full">限时</span>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <span class="font-medium text-gray-900">活动助手</span>
          <span class="text-xs text-gray-400">昨天</span>
        </div>
        <div class="text-sm text-gray-500 truncate mt-0.5">夏日大促 全场5折</div>
      </div>
    </div>

    <div class="flex items-center px-5 py-3.5 border-b border-gray-50">
      <div class="relative flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-red-400 to-pink-500 flex items-center justify-center text-white font-bold">会</div>
        <span class="absolute -top-1 -right-1 px-1.5 py-0.5 text-xs font-bold bg-yellow-500 text-white rounded-full">VIP</span>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <span class="font-medium text-gray-900">会员中心</span>
          <span class="text-xs text-gray-400">2天前</span>
        </div>
        <div class="text-sm text-gray-500 truncate mt-0.5">会员权益即将升级</div>
      </div>
    </div>

    <div class="flex items-center px-5 py-3.5">
      <div class="relative flex-shrink-0">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white font-bold">系</div>
        <span class="absolute -top-1 -right-1 px-1.5 py-0.5 text-xs font-bold bg-gray-500 text-white rounded-full">已读</span>
      </div>
      <div class="ml-3 flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <span class="font-medium text-gray-900">系统通知</span>
          <span class="text-xs text-gray-400">3天前</span>
        </div>
        <div class="text-sm text-gray-500 truncate mt-0.5">账号安全提醒</div>
      </div>
    </div>
  </div>

  <!-- Bottom nav with badges -->
  <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-100 pb-6">
    <div class="flex items-center pt-2">
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="text-xs mt-1 text-gray-400">通讯录</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="relative">
          <svg class="w-6 h-6 text-blue-500" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
          <span class="absolute -top-1 -right-2 px-1.5 py-0.5 text-xs font-bold bg-red-500 text-white rounded-full">99+</span>
        </div>
        <span class="text-xs mt-1 text-blue-500 font-medium">消息</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-10 h-10 -mt-3 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center shadow-lg">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        </div>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="relative">
          <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span class="absolute -top-1 -right-2 w-4 h-4 bg-red-500 rounded-full"></span>
        </div>
        <span class="text-xs mt-1 text-gray-400">动态</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs mt-1 text-gray-400">我的</span>
      </div>
    </div>
  </div>
</body>
</html>
