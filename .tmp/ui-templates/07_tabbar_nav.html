<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>TabBar Nav</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 375px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .status-bar { height: 44px; }
</style>
</head>
<body class="bg-gray-50">
  <!-- Status bar -->
  <div class="status-bar bg-white flex items-center justify-between px-6 text-sm font-semibold">
    <span>9:41</span>
    <span>100%</span>
  </div>

  <!-- Content: Home Tab -->
  <div class="pb-20">
    <!-- Header -->
    <div class="bg-white px-5 py-4 border-b border-gray-100">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm text-gray-400">早上好，欢迎回来</div>
          <h1 class="text-xl font-bold mt-0.5">我的主页</h1>
        </div>
        <div class="flex items-center gap-3">
          <div class="relative">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">9</span>
          </div>
          <div class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500"></div>
        </div>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="bg-white mx-4 mt-4 rounded-2xl p-4 shadow-sm">
      <div class="grid grid-cols-4 gap-3">
        <div class="flex flex-col items-center">
          <div class="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center text-2xl">💰</div>
          <span class="text-xs text-gray-600 mt-2">充值</span>
        </div>
        <div class="flex flex-col items-center">
          <div class="w-12 h-12 rounded-xl bg-green-100 flex items-center justify-center text-2xl">💳</div>
          <span class="text-xs text-gray-600 mt-2">提现</span>
        </div>
        <div class="flex flex-col items-center">
          <div class="w-12 h-12 rounded-xl bg-orange-100 flex items-center justify-center text-2xl">📊</div>
          <span class="text-xs text-gray-600 mt-2">账单</span>
        </div>
        <div class="flex flex-col items-center">
          <div class="relative">
            <div class="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center text-2xl">🎁</div>
            <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">5</span>
          </div>
          <span class="text-xs text-gray-600 mt-2">活动</span>
        </div>
      </div>
    </div>

    <!-- Balance card -->
    <div class="mx-4 mt-4 rounded-2xl bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 p-5 text-white shadow-lg">
      <div class="flex items-center justify-between">
        <span class="text-sm text-blue-100">账户余额</span>
        <svg class="w-5 h-5 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
      </div>
      <div class="text-3xl font-bold mt-2">¥ 12,856.32</div>
      <div class="flex items-center justify-between mt-4">
        <div>
          <div class="text-xs text-blue-200">今日收益</div>
          <div class="text-sm font-semibold mt-0.5">+¥ 28.50</div>
        </div>
        <div class="text-right">
          <div class="text-xs text-blue-200">累计收益</div>
          <div class="text-sm font-semibold mt-0.5">+¥ 1,234.00</div>
        </div>
      </div>
    </div>

    <!-- Recent transactions list -->
    <div class="mx-4 mt-4">
      <div class="flex items-center justify-between mb-3">
        <span class="font-semibold text-gray-900">最近交易</span>
        <span class="text-sm text-blue-500">查看全部 →</span>
      </div>
      <div class="bg-white rounded-2xl shadow-sm divide-y divide-gray-50">
        <div class="flex items-center px-4 py-3.5">
          <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-xl">↓</div>
          <div class="ml-3 flex-1">
            <div class="font-medium text-gray-900 text-sm">工资到账</div>
            <div class="text-xs text-gray-400 mt-0.5">今天 09:30</div>
          </div>
          <div class="text-right">
            <div class="font-semibold text-green-500">+¥8,500.00</div>
          </div>
        </div>
        <div class="flex items-center px-4 py-3.5">
          <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-xl">🛒</div>
          <div class="ml-3 flex-1">
            <div class="font-medium text-gray-900 text-sm">购物消费</div>
            <div class="text-xs text-gray-400 mt-0.5">昨天 18:42</div>
          </div>
          <div class="text-right">
            <div class="font-semibold text-gray-900">-¥299.00</div>
          </div>
        </div>
        <div class="flex items-center px-4 py-3.5">
          <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-xl">🎮</div>
          <div class="ml-3 flex-1">
            <div class="font-medium text-gray-900 text-sm">游戏充值</div>
            <div class="text-xs text-gray-400 mt-0.5">昨天 14:15</div>
          </div>
          <div class="text-right">
            <div class="font-semibold text-gray-900">-¥68.00</div>
          </div>
        </div>
        <div class="flex items-center px-4 py-3.5">
          <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-xl">💼</div>
          <div class="ml-3 flex-1">
            <div class="font-medium text-gray-900 text-sm">理财收益</div>
            <div class="text-xs text-gray-400 mt-0.5">昨天 08:00</div>
          </div>
          <div class="text-right">
            <div class="font-semibold text-green-500">+¥12.35</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-100 pb-4">
    <div class="flex items-center pt-2">
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-blue-500" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-xs mt-1 text-blue-500 font-medium">首页</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span class="text-xs mt-1 text-gray-400">理财</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="relative">
          <div class="w-12 h-12 -mt-4 rounded-full bg-gradient-to-r from-blue-500 to-indigo-500 flex items-center justify-center shadow-lg">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          </div>
        </div>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="relative">
          <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center">12</span>
        </div>
        <span class="text-xs mt-1 text-gray-400">消息</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-xs mt-1 text-gray-400">我的</span>
      </div>
    </div>
  </div>
</body>
</html>
